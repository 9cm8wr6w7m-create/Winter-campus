export async function getDb(){const d=await init();if(!d)return null;
 return {collection(name){let n=50;const q={orderBy(){return q},limit(k){n=k;return q},add:o=>push(ref(d,name),o),
  onSnapshot(cb,err){return onValue(query(ref(d,name),orderByChild('ts'),limitToLast(n)),s=>{const a=[];s.forEach(c=>{a.push(c.val())});a.reverse();cb({docs:a.map(v=>({data:()=>v}))})},err)}};return q}}}

export function getRoom(){return roomP||(roomP=(async()=>{const d=await init();if(!d)return null;
 const mine=ref(d,'players/'+myId),hs=[];let cur=null,last={peers:[]};
 const send=()=>cur?set(mine,{...cur,ts:Date.now()}).catch(()=>{}):Promise.resolve();
 onValue(ref(d,'.info/connected'),s=>{if(s.val()){onDisconnect(mine).remove();send()}});

 onValue(ref(d,'players'),s=>{const now=Date.now(),peers=[];s.forEach(c=>{const v=c.val()||{};if(c.key!==myId&&now-(v.ts||0)>45000)return;const {ts,...pr}=v;peers.push({peer:c.key,isMe:c.key===myId,presence:pr})});last={peers};hs.forEach(h=>h(last))});
 return {presence:o=>{cur=o;return send()},
  onPeers(h){hs.push(h);h(last);return()=>hs.splice(hs.indexOf(h),1)},
  async emit(topic,data){const r=push(ref(d,'events/'+topic),{id:myId,data,ts:Date.now()});setTimeout(()=>remove(r).catch(()=>{}),6000)},
  on(topic,h){const t0=Date.now()-2000;return onChildAdded(query(ref(d,'events/'+topic),limitToLast(5)),c=>{const v=c.val()||{};if((v.ts||0)<t0)return;h({peer:v.id,sameTab:v.id===myId,data:v.data,topic})})}}})())}

 for(let i=0;i<3;i++)add(new T.PlaneGeometry(1.4,1.7),MT(0xffd36b,0xffc040),x-w/3+i*w/3,h*.55,z+d/2+.05);

 const a=(geo,m,y)=>{const q=new T.Mesh(geo,m);q.position.y=y;g.add(q)};a(new T.CylinderGeometry(.4,.5,1.5,8),MT(0x7a5a40),.75);
 a(new T.ConeGeometry(2.4,3.2,10),MT(0x4f8a62),3);a(new T.ConeGeometry(1.8,2.8,10),MT(0xf4f8fb),4.7);a(new T.ConeGeometry(1.2,2.4,10),MT(0x5a9a70),6.2);
 if(lights)for(let i=0;i<14;i++){const q=new T.Mesh(new T.SphereGeometry(.14,6,6),MT(0xffffff,LC[i%4]));const an=i*2.4,y=2+i*.34,r=2.2-i*.13;q.position.set(Math.cos(an)*r,y,Math.sin(an)*r);g.add(q)}}

 const n=new T.Mesh(new T.ConeGeometry(.1,.5,6),MT(0xff8a30));n.position.set(0,2.9,.5);n.rotation.x=Math.PI/2;g.add(n);const sc=new T.Mesh(new T.TorusGeometry(.42,.1,6,12),MT(0xe0505a));sc.position.y=2.5;sc.rotation.x=Math.PI/2;g.add(sc)}

// ---------- snowballs ----------
const balls=[];
function spawnBall(x,z,dx,dz,own){const m=new T.Mesh(new T.SphereGeometry(.35,10,10),MT(0xffffff));m.position.set(x,1.8,z);S.add(m);balls.push({m,dx,dz,t:0,own})}
function throwBall(){if(creating||G)return;const r=me.g.rotation.y,dx=Math.sin(r),dz=Math.cos(r),p=me.g.position;spawnBall(p.x+dx,p.z+dz,dx,dz,true);room&&room.emit('ball',{x:p.x+dx,z:p.z+dz,dx,dz}).catch(()=>{})}
$('#snow').onclick=throwBall;

// ---------- network ----------
(async()=>{try{room=await getRoom()}catch(e){}
 if(!room)return;toast('실시간 접속 중!');
 room.onPeers(ch=>{const ids=new Set();ch.peers.forEach(p=>{if(p.isMe)return;ids.add(p.peer);const d=p.presence||{},a=d.a||{},key=JSON.stringify(a);let r=remotes[p.peer];
  if(!r||r.key!==key){const pos=r?r.g.position.clone():new T.Vector3(+d.x||0,0,+d.z||0);if(r)S.remove(r.g);r=remotes[p.peer]=mk(a);r.key=key;r.g.position.copy(pos)}
  r.tx=+d.x||0;r.tz=+d.z||0;r.tr=+d.r||0});
  for(const k in remotes)if(!ids.has(k)){S.remove(remotes[k].g);delete remotes[k]}$('#cnt').textContent='👥 '+(ids.size+1);pdirty=1});
 room.on('chat',m=>{if(m.sameTab)return;const t=clean(String((m.data||{}).t||'')).slice(0,40);if(!t)return;const r=remotes[m.peer];r&&r.say(t);addLog(String((m.data||{}).n||'익명').slice(0,8),t)});
 room.on('ball',m=>{if(m.sameTab)return;const d=m.data||{};if([d.x,d.z,d.dx,d.dz].every(Number.isFinite))spawnBall(d.x,d.z,d.dx,d.dz,false)});
})();

// ---------- wish tree ----------
let cards=[],wishes=[];
function renderWishes(list){wishes=list;cards.forEach(c=>S.remove(c));cards=[];const l=$('#wl');l.innerHTML='';
 list.forEach((w,i)=>{const t=clean(String(w.t||'')).slice(0,60),d=document.createElement('div');d.textContent='💌 '+t;l.appendChild(d);
  const s=spr(t.slice(0,9),{w:300,h:80,f:34,bg:'#fff6c9',fg:'#5a4a2a',d:110});const an=i*2.4;s.position.set(Math.cos(an)*3.4,2.5+(i%6)*.9,-36+Math.sin(an)*3.4);S.add(s);cards.push(s)})}
(async()=>{try{db=await getDb()}catch(e){}
 if(!db){$('#wn').textContent='공유 링크로 접속하면 모두의 소원이 함께 보여요.';return}
 try{db.collection('wishes').orderBy('ts','desc').limit(24).onSnapshot(s=>renderWishes((s.docs||[]).map(d=>d.data?d.data():d)),()=>{})}catch(e){}})();
$('#wb').onclick=async()=>{const i=$('#wt'),t=clean(i.value.trim()).slice(0,60);if(!t)return;
 if(db){try{await db.collection('wishes').add({t,ts:Date.now()})}catch(e){toast('소원을 저장하지 못했어요');return}}else renderWishes([{t},...wishes]);i.value='';toast('소원이 나무에 걸렸어요 🌠')};
$('#wc').onclick=()=>$('#ww').hidden=true;

// ---------- guestbook ----------
let gb=[],gbLast=0;const gbKey='wcgb';
const gbLocal=()=>{try{return JSON.parse(localStorage.getItem(gbKey)||'[]')}catch(e){return[]}};
const gbMerge=l=>{const k=new Set(l.map(w=>w.ts+'|'+w.t));return l.concat(gbLocal().filter(w=>!k.has(w.ts+'|'+w.t))).sort((a,b)=>b.ts-a.ts).slice(0,40)};
function renderGb(list){gb=list;const l=$('#gl');l.innerHTML='';list.forEach(w=>{const d=document.createElement('div');let ds='';try{ds=new Date(+w.ts).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}catch(e){}d.textContent='✏️ '+clean(String(w.n||'익명')).slice(0,8)+' ('+ds+'): '+clean(String(w.t||'')).slice(0,80);l.appendChild(d)})}
(async()=>{let d=null;try{d=await getDb()}catch(e){}
 renderGb(gbLocal());if(!d){$('#gn').textContent='📱 지금은 이 기기에만 저장돼요 (서버 연결 전)';return}$('#gn').textContent='☁️ 모두의 방명록이 서버에 저장돼요';
 try{d.collection('guestbook').orderBy('ts','desc').limit(40).onSnapshot(s=>renderGb(gbMerge((s.docs||[]).map(x=>x.data?x.data():x))),()=>{})}catch(e){}})();
$('#gs').onclick=async()=>{const i=$('#gt'),t=clean(i.value.trim()).slice(0,80);if(!t)return;if(Date.now()-gbLast<3000){toast('잠시 후 다시 남겨주세요');return}gbLast=Date.now();const e={n:A.name||'익명',t,ts:Date.now()};
 try{localStorage.setItem(gbKey,JSON.stringify([e,...gbLocal()].slice(0,40)))}catch(x){}
 renderGb(gbMerge(gb));let ok=false;
 if(db){try{await db.collection('guestbook').add(e);ok=true}catch(x){}}
 $('#gn').textContent=ok?'☁️ 서버에 저장됐어요':'📱 이 기기에 저장됐어요 (서버 연결 안 됨)';i.value='';toast(ok?'방명록에 남겼어요 📖':'이 기기에만 저장됐어요 📱')};
$('#gbb').onclick=()=>$('#gb').hidden=false;$('#gc').onclick=()=>$('#gb').hidden=true;

// ---------- sled minigame ----------
const sc=$('#sled'),sx=sc.getContext('2d');sc.width=360;sc.height=500;let G=null,best=+(()=>{try{return localStorage.getItem('sb')}catch(e){}})()||0,sk=0;
function sledStart(){G={x:180,o:[],d:0,sp:200,t:0,over:0};$('#sledbox').hidden=false}
function sledStep(dt){if(!G)return;const g=G;
 if(!g.over){const dir=(K.arrowleft||K.a?-1:0)+(K.arrowright||K.d?1:0)||sk;g.x=Math.max(30,Math.min(330,g.x+dir*260*dt));g.d+=g.sp*dt/20;g.sp=Math.min(520,g.sp+8*dt);g.t-=dt;
  if(g.t<=0){g.o.push({x:30+Math.random()*300,y:-30,e:['⛄','🌲','🪨'][Math.floor(Math.random()*3)]});g.t=Math.max(.35,.9-g.d/400)}
  g.o.forEach(o=>o.y+=g.sp*dt);g.o=g.o.filter(o=>o.y<540);
  if(g.o.some(o=>Math.abs(o.x-g.x)<26&&Math.abs(o.y-430)<30)){g.over=1;if(g.d>best){best=Math.floor(g.d);try{localStorage.setItem('sb',best)}catch(e){}}}}
 sx.fillStyle='#f4f9ff';sx.fillRect(0,0,360,500);sx.fillStyle='#dcebf8';for(let i=0;i<8;i++)sx.fillRect(0,((g.d*20+i*70)%500),360,3);
 sx.font='34px serif';sx.textAlign='center';g.o.forEach(o=>sx.fillText(o.e,o.x,o.y+12));sx.fillText('🛷',g.x,445);
 sx.fillStyle='#34506b';sx.font='bold 18px sans-serif';sx.textAlign='left';sx.fillText(Math.floor(g.d)+'m  (최고 '+best+'m)',10,26);
 if(g.over){sx.textAlign='center';sx.font='bold 26px sans-serif';sx.fillText('쿵! '+Math.floor(g.d)+'m',180,230);sx.font='16px sans-serif';sx.fillText('화면을 탭하면 다시 시작',180,262)}}
sc.addEventListener('pointerdown',e=>{if(G&&G.over){sledStart();return}const r=sc.getBoundingClientRect();sk=e.clientX<r.left+r.width/2?-1:1});
addEventListener('pointerup',()=>sk=0);
$('#sx').onclick=()=>{G=null;$('#sledbox').hidden=true};

// ---------- actions ----------
let cz=null,vi=0;const VW=[['기본',16,16],['가까이',8,9],['하늘에서',34,6]];
$('#vb').onclick=()=>{vi=(vi+1)%3;toast('시점: '+VW[vi][0])};
function applyView(){const w=innerWidth,h=innerHeight;if(creating){if(w>700)C.setViewOffset(w,h,w*.17,0,w,h);else C.setViewOffset(w,h,0,h*.2,w,h)}else C.clearViewOffset()}
$('#act').onclick=()=>{if(!cz)return;if(cz.k=='sled')sledStart();else if(cz.k=='wish')$('#ww').hidden=false;else if(cz.k=='hall')$('#gb').hidden=false};
const AL={sled:'🎿 썰매 타기',wish:'🌠 소원 남기기',hall:'📖 방명록 쓰기'};

// ---------- loop ----------
function resize(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();applyView()}addEventListener('resize',resize);resize();
let last=performance.now(),pt=0,face=0,lastP='';
function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.05);last=t;const p=me.g.position;
 let mx=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0)+jv.x,mz=(K.arrowdown||K.s?1:0)-(K.arrowup||K.w?1:0)+jv.y;const L=Math.hypot(mx,mz);
 if(!creating&&!G&&L>.12){const s=Math.min(1,L);mx/=L;mz/=L;p.x=Math.max(-62,Math.min(62,p.x+mx*7*s*dt));p.z=Math.max(-62,Math.min(62,p.z+mz*7*s*dt));face=Math.atan2(mx,mz);p.y=Math.abs(Math.sin(t*.012))*.18}else p.y=0;
 if(creating)face+=dt*.9;let d=face-me.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));me.g.rotation.y+=d*Math.min(1,dt*12);
 for(const k in remotes){const r=remotes[k],q=r.g.position;const mv=Math.hypot(r.tx-q.x,r.tz-q.z);q.x+=(r.tx-q.x)*Math.min(1,dt*8);q.z+=(r.tz-q.z)*Math.min(1,dt*8);q.y=mv>.3?Math.abs(Math.sin(t*.012))*.18:0;let e=r.tr-r.g.rotation.y;e=Math.atan2(Math.sin(e),Math.cos(e));r.g.rotation.y+=e*Math.min(1,dt*10)}
 for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.t+=dt;b.m.position.x+=b.dx*18*dt;b.m.position.z+=b.dz*18*dt;b.m.position.y=1.8-b.t*.4;
  if(!b.own&&Math.hypot(b.m.position.x-p.x,b.m.position.z-p.z)<1.1){me.say('앗 차가워!');p.x+=b.dx*2;p.z+=b.dz*2;b.t=9}
  if(b.t>1.6){S.remove(b.m);balls.splice(i,1)}}
 const pa=snowP.geometry.attributes.position;for(let i=0;i<N;i++){let y=pa.array[i*3+1]-dt*(2+i%5*.3);if(y<0)y+=30;pa.array[i*3+1]=y;pa.array[i*3]+=Math.sin(t*.001+i)*dt*.4}pa.needsUpdate=true;snowP.position.set(p.x,0,p.z);
 cz=Z.find(z=>Math.hypot(p.x-z.x,p.z-z.z)<z.r)||{n:'캠퍼스 산책로',k:'walk'};$('#loc').textContent='📍 '+cz.n;const ab=$('#act');ab.hidden=!AL[cz.k];if(AL[cz.k])ab.textContent=AL[cz.k];
 if(creating)C.position.lerp(new T.Vector3(p.x,3.6,p.z+7.5),.2),C.lookAt(p.x,2,p.z);else{const v=VW[vi];C.position.lerp(new T.Vector3(p.x,v[1],p.z+v[2]),Math.min(1,dt*5));C.lookAt(p.x,vi==1?1.5:0,p.z-(vi==2?0:1))}
 pt+=dt;if(room&&pt>.12){pt=0;const s=JSON.stringify([p.x.toFixed(1),p.z.toFixed(1),face.toFixed(2)]);if(s!==lastP||pdirty){lastP=s;pdirty=0;room.presence({x:+p.x.toFixed(1),z:+p.z.toFixed(1),r:+face.toFixed(2),a:A}).catch(()=>{})}}
 sledStep(dt);R.render(S,C)}
requestAnimationFrame(tick);

</script></body></html>
